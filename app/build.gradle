plugins {
    id 'com.android.application'
}

android {
    namespace 'com.cuiyi.liangcalibrator'
    compileSdk 34

    defaultConfig {
        applicationId "com.cuiyi.liangcalibrator"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.0.1"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.14.0'
}
